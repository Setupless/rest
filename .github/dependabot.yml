version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      bun-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
