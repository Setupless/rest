name: Pull request checks

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: Validate PR source
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch flow
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$BASE_BRANCH" == "main" && ( "$HEAD_BRANCH" != "dev" || "$HEAD_REPOSITORY" != "$REPOSITORY" ) ]]; then
            echo "Pull requests into main must come from dev."
            exit 1
          fi

          if [[ "$BASE_BRANCH" == "dev" && ( "$HEAD_BRANCH" == "main" || "$HEAD_BRANCH" == "dev" ) ]]; then
            echo "Pull requests into dev must come from a feature or maintenance branch."
            exit 1
          fi

  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and linting
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
