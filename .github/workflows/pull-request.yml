name: Validation

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: Validate PR source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch flow
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$BASE_BRANCH" == "main" && ( "$HEAD_BRANCH" != "dev" || "$HEAD_REPOSITORY" != "$REPOSITORY" ) ]]; then
            echo "Pull requests into main must come from dev."
            exit 1
          fi

          if [[ "$BASE_BRANCH" == "dev" && ( "$HEAD_BRANCH" == "main" || "$HEAD_BRANCH" == "dev" ) ]]; then
            echo "Pull requests into dev must come from a feature or maintenance branch."
            exit 1
          fi

  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and linting
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test with coverage gates
        run: bun run test:coverage

      - name: Build production server
        run: bun run build

      - name: Test built server over HTTP
        run: bun run test:e2e:built

      - name: Audit dependencies
        run: bun audit
